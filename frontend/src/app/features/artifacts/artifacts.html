<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h4 mb-0">Screenshots & Artifacts</h2>
    <button class="btn btn-sm btn-outline-secondary" (click)="load()">Refresh</button>
  </div>

  <div *ngIf="loading" class="text-secondary">Loading...</div>
  <div class="table-responsive" *ngIf="!loading">
    <table class="table table-sm table-hover">
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let f of files">
          <td>{{ f.name }}</td>
          <td>{{ f.type }}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" (click)="view(f)">View</button>
            <button class="btn btn-sm btn-outline-success me-1" *ngIf="f.type === 'diffs'" (click)="approve(f)">Approve</button>
            <button class="btn btn-sm btn-outline-danger" *ngIf="f.type === 'diffs'" (click)="reject(f)">Reject</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="modal fade show" tabindex="-1" *ngIf="selected" style="display:block; background:rgba(0,0,0,0.5)">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ selected.name }}</h5>
          <button type="button" class="btn-close" (click)="close()"></button>
        </div>
        <div class="modal-body text-center">
          <img [src]="getFileUrl(selected)" class="img-fluid" alt="screenshot" />
        </div>
      </div>
    </div>
  </div>
</div>
