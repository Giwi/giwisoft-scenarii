<div class="d-flex align-items-center gap-2 mb-3">
  <a
    [routerLink]="isNew ? '/scenarios' : '/scenario/' + scenarioName"
    class="btn btn-sm btn-outline-secondary"
    [title]="t('editor.back_title')"
  >
    <i class="bi bi-arrow-left"></i>
  </a>
  <h1 class="h5 mb-0">{{ isNew ? t('editor.new_title') : t('editor.edit_title', { name: scenarioName }) }}</h1>
  <div class="ms-auto d-flex gap-2">
    <a *ngIf="isNew" class="btn btn-sm btn-outline-primary" routerLink="/scenarios" [title]="t('editor.back_to_scenarios')">
      <i class="bi bi-list-ul"></i> {{ t('list.title') }}
    </a>
    <button class="btn btn-sm btn-success" (click)="save()" [disabled]="saving">
      <i class="bi bi-floppy me-1"></i>{{ saving ? t('common.saving') : isNew ? t('editor.create') : t('common.save') }}
    </button>
  </div>
</div>

<div class="alert alert-success" *ngIf="saved" role="alert">
  <i class="bi bi-check-circle me-1"></i> {{ t('editor.saved') }}
</div>
<div class="alert alert-danger" *ngIf="error" role="alert">
  <i class="bi bi-exclamation-triangle me-1"></i> {{ error }}
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <!-- Highlighted layer under a transparent textarea: both share identical metrics. -->
    <div class="editor">
      <pre #layer class="editor-layer" aria-hidden="true"><code><span
        *ngFor="let p of parts"
        [class]="'tok ' + p.cls"
        >{{ p.text }}</span
      ></code></pre>
      <textarea
        #ta
        class="editor-input"
        [(ngModel)]="yaml"
        (ngModelChange)="onYamlChange()"
        (scroll)="syncScroll(layer, ta)"
        spellcheck="false"
        autocomplete="off"
        autocapitalize="off"
      ></textarea>
    </div>
  </div>
</div>

<p class="small text-secondary mt-2 mb-0">
  <i class="bi bi-info-circle me-1"></i>
  {{ t('editor.hint') }}
</p>
