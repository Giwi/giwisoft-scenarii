<div class="d-flex align-items-center gap-2 mb-3">
  <a
    [routerLink]="isNew ? '/scenarios' : '/scenario/' + scenarioName"
    class="btn btn-sm btn-outline-secondary"
    title="Back"
  >
    <i class="bi bi-arrow-left"></i>
  </a>
  <h1 class="h5 mb-0">{{ isNew ? 'New scenario' : 'Edit: ' + scenarioName }}</h1>
  <div class="ms-auto d-flex gap-2">
    <a class="btn btn-sm btn-outline-primary" routerLink="/scenario/new" title="New scenario">
      <i class="bi bi-plus-lg"></i> New
    </a>
    <button class="btn btn-sm btn-success" (click)="save()" [disabled]="saving">
      <i class="bi bi-floppy me-1"></i>{{ saving ? 'Saving...' : isNew ? 'Create' : 'Save' }}
    </button>
  </div>
</div>

<div class="alert alert-success" *ngIf="saved" role="alert">
  <i class="bi bi-check-circle me-1"></i> Scenario saved successfully.
</div>
<div class="alert alert-danger" *ngIf="error" role="alert">
  <i class="bi bi-exclamation-triangle me-1"></i> {{ error }}
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <!-- Highlighted layer under a transparent textarea: both share identical metrics. -->
    <div class="editor">
      <pre #layer class="editor-layer" aria-hidden="true"><code><span
        *ngFor="let p of parts"
        [class]="'tok ' + p.cls"
        >{{ p.text }}</span
      ></code></pre>
      <textarea
        #ta
        class="editor-input"
        [(ngModel)]="yaml"
        (ngModelChange)="onYamlChange()"
        (scroll)="syncScroll(layer, ta)"
        spellcheck="false"
        autocomplete="off"
        autocapitalize="off"
      ></textarea>
    </div>
  </div>
</div>

<p class="small text-secondary mt-2 mb-0">
  <i class="bi bi-info-circle me-1"></i>
  YAML syntax is highlighted. The name becomes the filename on disk, so keep it unique.
</p>
