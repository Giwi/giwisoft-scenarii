<nav class="navbar navbar-expand" *ngIf="router.url !== '/login'">
  <div class="container">
    <a class="navbar-brand fw-semibold" routerLink="/scenarios">
      <i class="bi bi-activity me-2"></i>Scenarii
    </a>
    <div class="ms-auto d-flex gap-2 align-items-center">
      <a class="btn btn-sm btn-outline-secondary border-0" routerLink="/scenarios" title="Dashboard">
        <i class="bi bi-speedometer2 me-1"></i><span class="d-none d-sm-inline">Dashboard</span>
      </a>
      <a
        *ngIf="isAdmin()"
        class="btn btn-sm btn-outline-secondary border-0"
        routerLink="/users"
        title="Manage users"
      >
        <i class="bi bi-people me-1"></i><span class="d-none d-sm-inline">Users</span>
      </a>
      <span class="small text-secondary d-none d-sm-inline" *ngIf="status().username">
        <i class="bi bi-person-circle me-1"></i>{{ status().username }}
      </span>
      <button
        *ngIf="status().authenticated"
        class="btn btn-sm btn-outline-secondary border-0"
        (click)="logout()"
        title="Sign out"
      >
        <i class="bi bi-box-arrow-right me-1"></i><span class="d-none d-sm-inline">Sign out</span>
      </button>
      <a class="btn btn-sm btn-outline-secondary border-0" routerLink="/docs" title="Documentation">
        <i class="bi bi-journal-text me-1"></i><span class="d-none d-sm-inline">Docs</span>
      </a>
      <button
        class="btn btn-sm btn-outline-secondary border-0"
        (click)="toggleTheme()"
        aria-label="Toggle theme"
      >
        <i
          class="bi"
          [class.bi-sun-fill]="theme === 'light'"
          [class.bi-moon-fill]="theme === 'dark'"
        ></i>
      </button>
    </div>
  </div>
</nav>

<div class="container py-3 flex-fill" [class.container-fluid]="router.url === '/login'">
  <router-outlet />
</div>

<footer
  class="text-center py-3 small text-secondary border-top"
  style="border-color: var(--border) !important; background: var(--header-bg); backdrop-filter: blur(12px);"
>
  <div class="container">
    &copy;
    <a
      href="https://giwi.fr"
      target="_blank"
      rel="noopener"
      class="text-decoration-none fw-medium"
      style="color: var(--accent)"
      >GiwiSoft</a
    >
    2026
  </div>
</footer>
