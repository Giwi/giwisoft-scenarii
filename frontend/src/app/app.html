<nav class="navbar navbar-expand" *ngIf="router.url !== '/login'">
  <div class="container">
    <a class="navbar-brand fw-semibold" routerLink="/scenarios">
      <i class="bi bi-activity me-2"></i>Scenarii
    </a>
    <div class="ms-auto d-flex gap-2 align-items-center">
      <a class="btn btn-sm btn-outline-secondary border-0" routerLink="/scenarios" [title]="t('nav.dashboard_title')">
        <i class="bi bi-speedometer2 me-1"></i><span class="d-none d-sm-inline">{{ t('nav.dashboard') }}</span>
      </a>
      <a
        *ngIf="isAdmin()"
        class="btn btn-sm btn-outline-secondary border-0"
        routerLink="/users"
        [title]="t('nav.users_title')"
      >
        <i class="bi bi-people me-1"></i><span class="d-none d-sm-inline">{{ t('nav.users') }}</span>
      </a>
      <a class="btn btn-sm btn-outline-secondary border-0" routerLink="/docs" [title]="t('nav.docs_title')">
        <i class="bi bi-journal-text me-1"></i><span class="d-none d-sm-inline">{{ t('nav.docs') }}</span>
      </a>
      <!-- Profile: avatar on top of a label, and the entry point to appearance and language. -->
      <a
        class="btn btn-sm btn-outline-secondary border-0 d-flex align-items-center gap-2"
        routerLink="/profile"
        [title]="t('nav.signed_in_as', { username: status().username || '' })"
      >
        <img
          *ngIf="status().avatar_url; else avatarGlyph"
          [src]="status().avatar_url"
          class="nav-avatar"
          [alt]="t('nav.profile')"
        />
        <ng-template #avatarGlyph><i class="bi bi-person-circle"></i></ng-template>
        <span class="d-none d-md-inline">{{ t('nav.profile') }}</span>
      </a>
      <button
        *ngIf="status().authenticated"
        class="btn btn-sm btn-outline-secondary border-0"
        (click)="logout()"
        [title]="t('nav.signout_title')"
      >
        <i class="bi bi-box-arrow-right me-1"></i><span class="d-none d-sm-inline">{{ t('nav.signout') }}</span>
      </button>
    </div>
  </div>
</nav>

<div class="container py-3 flex-fill" [class.container-fluid]="router.url === '/login'">
  <router-outlet />
</div>

<footer
  class="text-center py-3 small text-secondary border-top"
  style="border-color: var(--border) !important; background: var(--header-bg); backdrop-filter: blur(12px);"
>
  <div class="container">
    &copy;
    <a
      href="https://giwi.fr"
      target="_blank"
      rel="noopener"
      class="text-decoration-none fw-medium"
      style="color: var(--accent)"
      >GiwiSoft</a
    >
    2026
  </div>
</footer>
