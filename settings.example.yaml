# API authentication. Bearer tokens protect /api/* (and /api/metrics).
api:
  auth:
    enabled: true
    # Legacy single key. Treated as an admin-scoped token.
    api_key: "YOUR_API_KEY"
    # Optional scoped tokens for CI and integrations.
    # Scopes: read | trigger | admin (admin implies read + trigger).
    # tokens:
    #   - name: ci-read
    #     token: "READ_ONLY_TOKEN"
    #     scopes: ["read"]
    #   - name: ci-trigger
    #     token: "TRIGGER_TOKEN"
    #     scopes: ["trigger"]
    #   - name: ci-admin
    #     token: "ADMIN_TOKEN"
    #     scopes: ["admin"]

# Dashboard authentication (optional)
#
# Auth is ON by default with local username/password login. On first start a user named
# "admin" is created with the role "admin" and a random password printed in the logs.
# Users have one of two roles: "admin" (can add/edit/delete users) or "user" (read-only
# dashboard). Only an admin can add a user: `npx scenarii user add <name> [password] [role]`
# or `POST /api/auth/users`.
#
# Add the `oidc` block below to switch to SSO instead. Roles are then inherited from the
# provider groups: membership of `admin_group` grants admin, everyone else is a plain user.
# The username claim is configurable, falling back to preferred_username, email, then sub.
auth:
  enabled: true                  # set to false to disable authentication entirely
  default_user: admin            # name of the auto-created user
  default_user_role: admin       # admin | user
  # oidc:
  #   issuer_url: "https://accounts.google.com"
  #   client_id: "YOUR_CLIENT_ID"
  #   client_secret: "YOUR_CLIENT_SECRET"
  #   redirect_uri: "http://localhost:3000/api/auth/callback"
  #   scopes: "openid profile email"
  #   username_claim: "preferred_username"   # claim used as the local username
  #   groups_claim: "groups"                 # claim holding the group memberships
  #   admin_group: "scenarii-admins"         # group granting the admin role

# Database storage settings
storage:
  retentionDays: 30          # data retention period (default 7)
  backup:                    # optional automated SQLite backups
    enabled: true
    cron: "0 4 * * *"       # default: daily at 4am
    directory: "./backups"  # default: ./backups

# Alerting channels - fire on state transitions (pass->fail, fail->pass)
notifications:
  telegram:
    enabled: false
    bot_token: "YOUR_BOT_TOKEN"
    chat_id: "YOUR_CHAT_ID"
  email:
    enabled: false
    # Shared sender address, used by whichever transport below is configured.
    from: "scenarii <notifications@YOUR_DOMAIN>"
    to:
      - "admin@example.com"
    # SMTP transport (preferred when configured). tls: true = implicit TLS (SMTPS, port
    # 465); otherwise STARTTLS is used when the server advertises it.
    # smtp:
    #   host: smtp.example.com
    #   port: 587
    #   username: your-username            # omit both for an unauthenticated relay
    #   password: your-password
    #   tls: false
    #   rejectUnauthorized: true           # false only for self-signed relays (insecure)
    #   # ca: |                            # extra CA certificate (PEM), optional
    #   #   -----BEGIN CERTIFICATE-----
    mailgun:
      api_key: "YOUR_API_KEY"
      domain: "YOUR_DOMAIN"
  slack:
    enabled: false
    webhook_url: "https://hooks.slack.com/services/..."
  discord:
    enabled: false
    webhook_url: "https://discord.com/api/webhooks/..."
  webhook:
    enabled: false
    url: "https://your-endpoint/hook"

# Inbound CI webhooks (optional). GitHub uses HMAC-SHA256 (X-Hub-Signature-256),
# GitLab uses its secret token (X-Gitlab-Token). Rules are evaluated in order.
# webhooks:
#   enabled: true
#   secret: "YOUR_WEBHOOK_SECRET"
#   rules:
#     - provider: github
#       repository: "acme/web"
#       events: ["push", "pull_request"]
#       branches: ["main", "release/*"]
#       scenario: "preview-check"
#       variables:
#         DEPLOY_TARGET: "https://preview-{{pr}}.example.com"

# Per-scenario overrides (optional)
scenarios:
  my-scenario:
    ignoreHTTPSErrors: true
    timeout: 60000
    notifications:
      enabled: false
